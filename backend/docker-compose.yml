version: '3.8'

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: nobroker_db_urxe
      POSTGRES_USER: root
      POSTGRES_PASSWORD: SECRET_KEY
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: DATABASE_URL
      SECRET_KEY: SECRET_KEY
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data: