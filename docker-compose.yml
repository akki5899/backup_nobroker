version: '3.8'\n\nservices:\n  # PostgreSQL Database\n  postgres:\n    image: postgres:15-alpine\n    container_name: nobroker_postgres\n    environment:\n      POSTGRES_DB: nobroker\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: postgres\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql\n    ports:\n      - \"5432:5432\"\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # Redis Cache\n  redis:\n    image: redis:7-alpine\n    container_name: nobroker_redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # Backend API\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: nobroker_backend\n    environment:\n      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/nobroker\n      - REDIS_URL=redis://redis:6379\n      - SECRET_KEY=your-secret-key-here\n      - ENVIRONMENT=development\n    ports:\n      - \"8000:8000\"\n    volumes:\n      - ./backend/uploads:/app/uploads\n    depends_on:\n      postgres:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n\n  # Frontend\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: nobroker_frontend\n    environment:\n      - NEXT_PUBLIC_API_URL=http://localhost:8000\n      - NEXT_PUBLIC_SITE_URL=http://localhost:3000\n    ports:\n      - \"3000:3000\"\n    depends_on:\n      backend:\n        condition: service_healthy\n\n  # Nginx Reverse Proxy (Production)\n  nginx:\n    image: nginx:alpine\n    container_name: nobroker_nginx\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf\n      - ./ssl:/etc/nginx/ssl\n    depends_on:\n      - frontend\n      - backend\n    profiles:\n      - production\n\nvolumes:\n  postgres_data:\n  redis_data:\n\nnetworks:\n  default:\n    name: nobroker_network